<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found, TiraMood</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a2e20">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=30">
</head>
<body>

<!-- Cloudflare serves this for any address that is not a real page.
     Without it, a mistyped address quietly returns the home page with
     a 200, which tells a search engine the page exists. -->

<div class="page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="brand-mark" src="/assets/img/logo.png" alt="TiraMood" width="44" height="44">
        <span class="brand-text">
          <span class="brand-name">TiraMood</span>
          <span class="brand-kind">Tiramisu and cakes</span>
        </span>
      </a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="notice">
          <h1 class="section-title">That page is not here</h1>
          <p>The address may be mistyped, or it may be something we have since
            taken down. Nothing is wrong with the shop.</p>
          <p style="margin-top:1.2rem">
            <a class="btn btn-primary" href="/">Go to the menu</a>
          </p>
        </div>
      </div>
    </section>
  </main>
</div>

</body>
</html>
